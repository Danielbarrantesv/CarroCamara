# Gradle JVM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Encoding (force UTF-8 for all resource processing)
org.gradle.encoding=utf-8

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# Gradle performance (desactivado paralelismo para evitar MalformedInputException en resolución de artefactos)
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Non-transitive R classes (faster build, smaller app)
android.nonTransitiveRClass=true
