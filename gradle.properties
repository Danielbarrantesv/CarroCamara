# Gradle JVM (reducido por RAM limitada del sandbox)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Dhttp.agent=Mozilla/5.0

# Encoding (force UTF-8 for all resource processing)
org.gradle.encoding=utf-8

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# Gradle performance (desactivado paralelismo para evitar MalformedInputException en resolución de artefactos)
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Non-transitive R classes (faster build, smaller app)
android.nonTransitiveRClass=true
org.gradle.java.home=/home/z/tools/jdk-17.0.13+11
